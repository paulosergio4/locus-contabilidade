<!doctype html>
<html lang="pt-BR" translate="no" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!-- O site já está em português: evita o Chrome oferecer tradução por engano -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>App Lócus</title>
    <meta
      name="description"
      content="App da Lócus Contabilidade Estratégica: guias, documentos, painel e atendimento."
    />
    <meta name="theme-color" content="#F4F2EE" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icones/icone-192.png" />
    <link rel="apple-touch-icon" href="icones/icone-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lócus" />
    <link rel="stylesheet" href="../compartilhado/css/fontes.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="../compartilhado/vendor/supabase.js" defer></script>
    <script src="js/main.js" type="module"></script>
  </head>
  <body>
    <!-- Logo usado no login e no menu lateral -->
    <svg width="0" height="0" class="sr-only" aria-hidden="true">
      <!-- L de eixos fino com o ponto cobre + nome em Mulish (mesmo desenho do kit de marca) -->
      <symbol id="logo-lockup" viewBox="0 0 300 64">
        <path
          d="M9 6 V54 H57"
          fill="none"
          stroke="var(--ink)"
          stroke-width="4.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="37" cy="28" r="7.8" fill="var(--copper)" />
        <text
          x="76"
          y="40"
          font-family="Mulish, sans-serif"
          font-weight="600"
          font-size="38"
          letter-spacing="1.5"
          fill="var(--ink)"
        >
          Lócus
        </text>
        <text
          x="77"
          y="57"
          font-family="Mulish, sans-serif"
          font-weight="600"
          font-size="9.5"
          letter-spacing="2.2"
          fill="var(--muted)"
        >
          CONTABILIDADE ESTRATÉGICA
        </text>
      </symbol>
    </svg>
    <!-- Tela de entrada: aparece enquanto ninguém está logado -->
    <section class="login" id="login" hidden aria-labelledby="login-titulo">
      <svg class="lg" viewBox="0 0 300 64" role="img" aria-label="Lócus Contabilidade Estratégica">
        <use href="#logo-lockup" />
      </svg>
      <div id="login-conteudo"></div>
    </section>

    <!-- App: abas e conteúdo -->
    <div class="app" id="app" hidden>
      <nav class="tabs" id="tabs" aria-label="Menu do app"></nav>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <div class="sheet-bg" id="sheetBg"></div>
    <div
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-label="Detalhes"
      tabindex="-1"
    >
      <div class="grab"></div>
      <div id="sheetBody"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"><i></i><span id="toastTx"></span></div>
  </body>
</html>
